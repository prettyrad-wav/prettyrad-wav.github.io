# Builds the Vite app and publishes dist/ to GitHub Pages on every push to main.
# Only main triggers this — feature/* and dev branches are never deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for the actions/deploy-pages step to publish via the Pages API.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment can run at a time; a newer push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Installs deps and produces dist/. If this job fails, the deploy job below is
  # skipped entirely and the previously published site keeps serving unchanged.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # VITE_* values come from GitHub Actions repository secrets (never hardcoded
        # here) so the build has the same env vars in CI as it does locally via .env.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Publishes the uploaded artifact to GitHub Pages. Depends on build succeeding.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
